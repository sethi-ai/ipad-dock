  /* Layout: StandBy-style dock. Clock left, month calendar right in landscape; stacked in portrait. Written for old Safari: no clamp(), min(), flex gap or inset. */
  :root {
    --bg: #050506;
    --fg: #f4f2ee;
    --mute: #8d8a85;
    --accent: #ff6a2b;
    --accent-ink: #0b0502;
    --font-display: "Barlow Condensed", "Helvetica Neue", -apple-system, Arial, sans-serif;
    --font-body: "Barlow", "Helvetica Neue", -apple-system, Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  html { height: 100%; background: #050506; }
  body {
    height: 100%;
    margin: 0;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-top: 2vmin;
    padding-bottom: 2vmin;
    padding-left: 16px;
    padding-right: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  :root { --card: #17171a; }
  body.dim { --card: #1d0a05; }
  body.desk { --card: #04200d; }
  body.dim {
    --bg: #000;
    --fg: #8f2a1a;
    --mute: #52190f;
    --accent: #a8331b;
    --accent-ink: #1a0603;
  }
  .dock {
    position: relative;
    z-index: 1;
    height: 100%;
    display: table;
    width: 100%;
    table-layout: fixed;
  }
  .clock, .cal {
    display: table-cell;
    vertical-align: middle;
    width: 50%;
    min-width: 0;
    box-sizing: border-box;
  }
  .clock { text-align: center; padding-right: 2vmin; }
  .cal { padding-left: 2vmin; }

  .dayname {
    font-weight: 600;
    font-size: 3.2vw;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1vw;
  }
  .time {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 21vw;
    line-height: 0.95;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    position: relative;
    display: inline-block;
  }
  .ampm {
    position: absolute;
    left: 100%;
    bottom: 0.1em;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.17em;
    letter-spacing: 0.1em;
    color: var(--mute);
    margin-left: 1.4em;
    line-height: 1;
  }
  .fulldate { font-size: 3vw; color: var(--mute); margin-top: 2.4vw; letter-spacing: 0.04em; }

  .cal { font-size: 3.4vmin; }
  .month {
    overflow: hidden;
    font-weight: 600;
    font-size: 1.3em;
    margin-bottom: 0.6em;
  }
  .month small { float: right; margin-top: 0.3em; font-size: 0.7em; color: var(--mute); font-weight: 400; letter-spacing: 0.1em; }
  .grid {
    overflow: hidden;
  }
  .d {
    float: left;
    width: 14.28%;
    box-sizing: border-box;
    margin-bottom: 0.15em;
    text-align: center;
    line-height: 1.9em;
    font-variant-numeric: tabular-nums;
  }
  .d span { display: inline-block; width: 1.9em; height: 1.9em; border-radius: 50%; }
  .h { color: var(--mute); font-size: 0.78em; letter-spacing: 0.1em; }
  .wk { color: var(--mute); }
  .today span { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .hint {
    position: fixed;
    z-index: 3;
    left: 0; right: 0; bottom: 1.5vmin;
    text-align: center;
    font-size: 1.8vmin;
    letter-spacing: 0.08em;
    color: var(--mute);
  }

  html, body { cursor: pointer; }
  .menu {
    position: fixed;
    z-index: 3;
    left: 0; right: 0; bottom: 4vmin;
    text-align: center;
    padding: 0 16px;
  }
  .menu button {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 2.6vmin;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--mute);
    border-radius: 999px;
    padding: 0.8em 1.3em;
    margin: 0.8vmin;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  /* Date-only layout: clock plus day, date and year */
  body.layout-date .clock { padding: 0; width: 100%; }
  body.layout-date .cal { display: none; }
  body.layout-date .dayname { font-size: 5vh; margin-bottom: 1.5vh; }
  body.layout-date .time { font-size: 40vh; }
  body.layout-date .fulldate { font-size: 8vh; margin-top: 2vh; color: var(--fg); }

  /* Focus layout: day and clock fill the screen, date sits in the footer */
  body.layout-focus .dock { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: table; -webkit-transform: none; transform: none; padding: 0 16px; box-sizing: border-box; }
  body.layout-focus .clock { display: table-cell; width: 100%; padding: 0; margin: 0; vertical-align: middle; }
  body.layout-focus .cal { display: none; }
  .headline { display: none; }
  body.layout-focus .headline { display: block; position: absolute; left: 0; right: 0; top: 5vh; font-size: 7vh; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); white-space: nowrap; }
  body.layout-focus .dayname, body.layout-focus .fulldate { display: none; }
  body.desk .headline { font-weight: 400; text-shadow: 0 0 0.6em rgba(200, 255, 214, 0.5); }
  body.layout-focus .ampm { margin-left: 0.6em; }
  body.layout-focus .time { font-size: 50vh; }
  body.h24.layout-focus .time { font-size: 58vh; }
  body.layout-focus .fulldate { position: absolute; left: 0; right: 0; bottom: 6vh; margin: 0; font-size: 5vh; letter-spacing: 0.12em; color: var(--mute); }


  /* Desk mode: green phosphor terminal look. Monospace is wider, so the clock is sized smaller. */
  body.desk {
    --bg: #000a03;
    --fg: #3dff72;
    --mute: #1d8f40;
    --accent: #c8ffd6;
    --accent-ink: #00140a;
    --font-display: "Share Tech Mono", Menlo, "Courier New", monospace;
    --font-body: "Share Tech Mono", Menlo, "Courier New", monospace;
  }
  body.desk {
    background: #000a03;
    background-image: -webkit-radial-gradient(50% 42%, ellipse farthest-corner, #052a12 0%, #031608 38%, #010a04 70%, #000000 100%);
    background-image: radial-gradient(ellipse farthest-corner at 50% 42%, #052a12 0%, #031608 38%, #010a04 70%, #000000 100%);
  }
  body.desk .time { font-weight: 400; font-size: 12vw; letter-spacing: 0; text-shadow: 0 0 0.14em rgba(61, 255, 114, 0.55); }
  body.desk .dayname { font-weight: 400; letter-spacing: 0.3em; text-shadow: 0 0 0.6em rgba(200, 255, 214, 0.5); }
  body.desk .ampm, body.desk .month, body.desk .today span, body.desk .menu button { font-weight: 400; }
  body.desk .today span { border-radius: 0.15em; }
  body.desk .fulldate { text-shadow: 0 0 0.5em rgba(61, 255, 114, 0.35); }
  body.desk.layout-date .time { font-size: 26vh; }
  body.desk.layout-focus .time { font-size: 34vh; }
  body.desk.h24.layout-focus .time { font-size: 40vh; }

  @media (orientation: portrait) {
    .dock { display: block; height: auto; position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); padding: 0 16px; box-sizing: border-box; }
    .clock, .cal { display: block; width: 100%; padding: 0; }
    .clock { margin-bottom: 7vw; }
    body.layout-date .clock { margin-bottom: 0; }
    .dayname { font-size: 4.2vw; }
    .time { font-size: 30vw; }
    .fulldate { font-size: 4.2vw; }
    .cal { font-size: 4.2vw; }
    .hint { font-size: 2.8vw; }
    .menu button { font-size: 3.2vw; }
    body.layout-date .dayname { font-size: 5vw; margin-bottom: 2vw; }
    body.layout-date .time { font-size: 30vw; }
    body.layout-date .fulldate { font-size: 7vw; margin-top: 3vw; }
    body.desk .time { font-size: 20vw; }
    body.desk.layout-date .time { font-size: 22vw; }
    body.layout-focus .headline { font-size: 5.6vw; top: 6vw; }
    body.layout-focus .time { font-size: 35vw; }
    body.h24.layout-focus .time { font-size: 41vw; }
    body.layout-focus .fulldate { font-size: 5vw; bottom: 6vw; }
    body.desk.layout-focus .time { font-size: 25vw; }
    body.desk.h24.layout-focus .time { font-size: 29vw; }
  }

  /* Countdown line: shows days (or hours on the last day) to a chosen date. Hidden until a date is saved. */
  .cdline { display: none; color: var(--accent); font-weight: 600; letter-spacing: 0.06em; }
  body.has-count .cdline { display: block; }
  body.layout-cal.has-count .cdline, body.layout-date.has-count .cdline { margin-top: 2.4vw; font-size: 3vw; }
  body.layout-date.has-count .cdline { margin-top: 2vh; font-size: 5vh; }
  body.layout-focus.has-count .cdline { position: absolute; left: 0; right: 0; bottom: 6vh; margin: 0; font-size: 6.4vh; }
  body.desk .cdline { font-weight: 400; text-shadow: 0 0 0.5em rgba(61, 255, 114, 0.45); }

  .panel { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; background: rgba(0, 0, 0, 0.9); text-align: center; overflow: auto; }
  .box { display: inline-block; box-sizing: border-box; width: 86%; max-width: 440px; margin-top: 5vh; padding: 22px; text-align: left; background: var(--bg); border: 1px solid var(--mute); border-radius: 18px; font-family: var(--font-body); color: var(--fg); }
  .box .ptitle { font-size: 22px; font-weight: 600; margin-bottom: 14px; color: var(--accent); }
  .box label { display: block; font-size: 15px; color: var(--mute); margin: 12px 0 6px; letter-spacing: 0.06em; }
  .box input { display: block; box-sizing: border-box; width: 100%; font-family: var(--font-body); font-size: 20px; padding: 10px 12px; color: var(--fg); background: #111; border: 1px solid var(--mute); border-radius: 10px; -webkit-appearance: none; appearance: none; }
  .box .prow { margin-top: 20px; text-align: right; }
  .box button { font-family: var(--font-body); font-weight: 600; font-size: 18px; color: var(--fg); background: var(--bg); border: 1px solid var(--mute); border-radius: 999px; padding: 10px 20px; margin-left: 8px; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .box button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  @media (orientation: portrait) {
    body.layout-cal.has-count .cdline, body.layout-date.has-count .cdline { font-size: 4.6vw; margin-top: 3vw; }
    body.layout-focus.has-count .cdline { font-size: 5.6vw; bottom: 6vw; }
    .box { margin-top: 8vh; }
  }
  body.layout-clock .headline, body.layout-clock.has-count .cdline { display: none; }

  /* Google Nest style clock faces: tall bold digits, as flip cards or stacked. Static, so no battery cost. */
  .alt { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 1; table-layout: fixed; }
  .flip, .stack { display: none; vertical-align: middle; text-align: center; }
  body.layout-flip .clock, body.layout-flip .cal, body.layout-stack .clock, body.layout-stack .cal, body.layout-flip .cdline, body.layout-stack .cdline { display: none; }
  body.layout-flip .alt, body.layout-stack .alt { display: table; }
  body.layout-flip .flip { display: table-cell; }
  body.layout-stack .stack { display: table-cell; }
  .card { display: inline-block; position: relative; box-sizing: border-box; width: 44vw; height: 74vh; margin: 0 1.4vw; border-radius: 3.4vh; background: var(--card); line-height: 74vh; overflow: hidden; vertical-align: middle; }
  .card:after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.9vh; margin-top: -0.45vh; background: var(--bg); }
  .dg { display: inline-block; font-family: "Barlow Condensed", var(--font-display); font-weight: 600; font-size: 62vh; line-height: 74vh; color: var(--fg); -webkit-transform: scale(1, 1.18); transform: scale(1, 1.18); }
  .ftag { position: absolute; left: 3vw; bottom: 3vh; font-size: 4.4vh; font-weight: 600; letter-spacing: 0.1em; color: var(--mute); }
  .srow { font-family: "Barlow Condensed", var(--font-display); font-weight: 600; font-size: 40vh; line-height: 40vh; height: 40vh; color: var(--fg); -webkit-transform: scale(1, 1.2); transform: scale(1, 1.2); font-variant-numeric: tabular-nums; margin: 3vh 0; }
  .stack { padding-bottom: 4vh; }
  .s2 { color: var(--accent); }
  .stag { position: fixed; right: 5vh; bottom: 5vh; font-size: 4.6vh; font-weight: 600; letter-spacing: 0.1em; color: var(--mute); }
  body.desk .dg, body.desk .srow { font-family: var(--font-display); font-weight: 400; text-shadow: 0 0 0.12em rgba(61, 255, 114, 0.5); }
  body.desk .dg { font-size: 46vh; }
  body.desk .srow { font-size: 34vh; line-height: 34vh; height: 34vh; }
  @media (orientation: portrait) {
    .card { width: 44vw; height: 66vw; line-height: 66vw; margin: 0 1.4vw; border-radius: 4vw; }
    .card:after { height: 1.2vw; margin-top: -0.6vw; }
    .dg { font-size: 41vw; line-height: 66vw; }
    .ftag { left: 4vw; bottom: 4vw; font-size: 4vw; }
    .srow { font-size: 58vw; line-height: 58vw; height: 58vw; margin: 4vw 0; }
    .stag { right: 5vw; bottom: 5vw; font-size: 4.6vw; }
    body.desk .dg { font-size: 30vw; }
    body.desk .srow { font-size: 50vw; line-height: 50vw; height: 50vw; }
  }
</style>
</head>
<body>
<div class="dock" id="dock">
  <div class="clock">
    <div class="headline" id="headline">&nbsp;</div>
    <div class="dayname" id="dayname">&nbsp;</div>
    <div class="time"><span id="time">--:--</span><span class="ampm" id="ampm"></span></div>
    <div class="fulldate" id="fulldate">&nbsp;</div>
    <div class="cdline" id="cdline"></div>
  </div>
  <div class="cal">
    <div class="month"><span id="monthname">&nbsp;</span><small id="year"></small></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="alt" id="alt">
  <div class="flip" id="flip"><div class="card"><span class="dg" id="fh">--</span></div><div class="card"><span class="dg" id="fm">--</span></div><div class="ftag" id="ftag"></div></div>
  <div class="stack" id="stack"><div class="srow s1" id="sh">--</div><div class="srow s2" id="sm">--</div><div class="stag" id="stag"></div></div>
</div>
<div class="menu" id="menu" hidden>
  <button type="button" id="b-time"></button>
  <button type="button" id="b-layout"></button>
  <button type="button" id="b-count">Countdown</button>
  <button type="button" id="b-mode"></button>
</div>
<div class="panel" id="panel" hidden>
  <div class="box">
    <div class="ptitle">Countdown</div>
    <label for="in-label">Name (up to 20 letters)</label>
    <input id="in-label" type="text" maxlength="20" placeholder="Diwali" autocomplete="off" autocorrect="off">
    <label for="in-date">Date</label>
    <input id="in-date" type="date">
    <div class="prow"><button type="button" id="p-clear">Clear</button><button type="button" id="p-close">Close</button><button type="button" class="go" id="p-save">Save</button></div>
  </div>
</div>
<div class="hint" id="hint">Tap the screen for settings</div>

<script>
(function () {
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var LETTERS = ["S","M","T","W","T","F","S"];
  var $ = function (id) { return document.getElementById(id); };
  var use24 = false;
  try { use24 = window.localStorage.getItem("dock24") === "1"; } catch (e) {}

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  var calKey = "";
  function drawCalendar(d) {
    var y = d.getFullYear(), m = d.getMonth(), today = d.getDate();
    var key = y + "-" + m + "-" + today;
    if (key === calKey) { return; }
    calKey = key;
    $("monthname").textContent = MONTHS[m];
    $("year").textContent = y;
    var first = new Date(y, m, 1).getDay();
    var total = new Date(y, m + 1, 0).getDate();
    var html = "", i, col;
    for (i = 0; i < 7; i++) { html += '<div class="d h">' + LETTERS[i] + "</div>"; }
    for (i = 0; i < first; i++) { html += '<div class="d"></div>'; }
    for (i = 1; i <= total; i++) {
      col = (first + i - 1) % 7;
      var cls = "d" + (i === today ? " today" : (col === 0 || col === 6 ? " wk" : ""));
      html += '<div class="' + cls + '"><span>' + i + "</span></div>";
    }
    $("grid").innerHTML = html;
  }

  // Countdown: days between today and a saved date. Names are written with textContent only.
  var cdDate = "", cdLabel = "";
  function daysLeft(d) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(cdDate)) { return null; }
    var q = cdDate.split("-");
    return Math.round((Date.UTC(+q[0], +q[1] - 1, +q[2]) - Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  }
  function drawCount(d) {
    var n = daysLeft(d), txt = "", name = cdLabel, tail = "";
    if (n !== null) {
      if (n >= 2) { tail = n + " Days to go"; }
      else if (n === 1) {
        var m = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() - d.getTime();
        var hrs = Math.max(1, Math.ceil(m / 3600000));
        tail = hrs + (hrs === 1 ? " Hour to go" : " Hours to go");
      }
      else if (n === 0) { tail = "Today"; }
      else { tail = (-n) + (n === -1 ? " Day ago" : " Days ago"); }
      txt = name ? name + " - " + tail : tail;
    }
    setText("cdline", txt);
    if (txt) { document.body.classList.add("has-count"); } else { document.body.classList.remove("has-count"); }
  }

  // Battery: the screen updates once a minute, only when a value changed.
  var shown = {};
  function setText(id, val) {
    if (shown[id] !== val) { shown[id] = val; $(id).textContent = val; }
  }

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var suffix = "";
    if (!use24) {
      suffix = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) { h = 12; }
    } else {
      h = pad(h);
    }
    setText("time", h + ":" + pad(d.getMinutes()));
    setText("ampm", suffix);
    setText("fh", String(h)); setText("sh", String(h));
    setText("fm", pad(d.getMinutes())); setText("sm", pad(d.getMinutes()));
    setText("ftag", suffix); setText("stag", suffix);
    setText("dayname", DAYS[d.getDay()]);
    setText("headline", DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + " " + String(d.getFullYear()).slice(2));
    setText("fulldate", d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear());
    drawCalendar(d);
    drawCount(d);
  }

  var timer = null;
  function schedule() {
    clearTimeout(timer);
    var d = new Date();
    var wait = 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 30;
    timer = setTimeout(function () { tick(); schedule(); }, wait);
  }
  tick();
  schedule();
  // Catch up straight away if the iPad was asleep or the app was in the background
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { tick(); schedule(); }
  }, false);
  window.addEventListener("pageshow", function () { tick(); schedule(); }, false);

  // Settings: tap the screen to show or hide a small settings bar. Choices are remembered.
  function store(key, val) { try { window.localStorage.setItem(key, val); } catch (e) {} }
  function load(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  var body = document.body;
  var layout = load("dockLayout");
  if (layout !== "date" && layout !== "focus" && layout !== "clock" && layout !== "flip" && layout !== "stack") { layout = "cal"; }
  var LAYOUT_LABEL = { cal: "Calendar", date: "Date only", focus: "Focus", clock: "Clock only", flip: "Flip clock", stack: "Stacked clock" };
  var LAYOUT_NEXT = { cal: "date", date: "focus", focus: "clock", clock: "flip", flip: "stack", stack: "cal" };
  cdDate = load("dockCdDate") || "";
  cdLabel = load("dockCdLabel") || "";
  var mode = load("dockMode");
  if (mode !== "night" && mode !== "desk" && mode !== "normal") { mode = load("dockNight") === "1" ? "night" : "normal"; }
  var MODE_LABEL = { normal: "Normal", night: "Night", desk: "Desk" };
  var MODE_NEXT = { normal: "night", night: "desk", desk: "normal" };

  function applySettings() {
    if (layout === "date") { body.classList.add("layout-date"); } else { body.classList.remove("layout-date"); }
    if (layout === "focus" || layout === "clock") { body.classList.add("layout-focus"); } else { body.classList.remove("layout-focus"); }
    if (layout === "clock") { body.classList.add("layout-clock"); } else { body.classList.remove("layout-clock"); }
    if (layout === "flip") { body.classList.add("layout-flip"); } else { body.classList.remove("layout-flip"); }
    if (layout === "stack") { body.classList.add("layout-stack"); } else { body.classList.remove("layout-stack"); }
    if (use24) { body.classList.add("h24"); } else { body.classList.remove("h24"); }
    if (layout === "cal") { body.classList.add("layout-cal"); } else { body.classList.remove("layout-cal"); }
    if (mode === "night") { body.classList.add("dim"); } else { body.classList.remove("dim"); }
    if (mode === "desk") { body.classList.add("desk"); } else { body.classList.remove("desk"); }
    $("b-time").textContent = "Clock: " + (use24 ? "24 hour" : "12 hour");
    $("b-layout").textContent = "Layout: " + LAYOUT_LABEL[layout];
    $("b-mode").textContent = "Mode: " + MODE_LABEL[mode];
  }

  var menuTimer = null;
  function hideMenu() { clearTimeout(menuTimer); $("menu").hidden = true; }
  function showMenu() {
    var h = $("hint");
    if (h && h.parentNode) { h.parentNode.removeChild(h); }
    $("menu").hidden = false;
    clearTimeout(menuTimer);
    menuTimer = setTimeout(function () { if ($("panel").hidden) { hideMenu(); } }, 6000);
  }
  function press(change) {
    return function (e) {
      e.stopPropagation();
      change();
      applySettings();
      tick();
      showMenu();
    };
  }
  $("b-time").addEventListener("click", press(function () { use24 = !use24; store("dock24", use24 ? "1" : "0"); }), false);
  $("b-layout").addEventListener("click", press(function () { layout = LAYOUT_NEXT[layout]; store("dockLayout", layout); }), false);
  $("b-mode").addEventListener("click", press(function () { mode = MODE_NEXT[mode]; store("dockMode", mode); }), false);
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  $("b-count").addEventListener("click", function (e) {
    e.stopPropagation();
    $("in-label").value = cdLabel;
    var now = new Date();
    $("in-date").min = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
    $("in-date").value = cdDate;
    hideMenu();
    $("panel").hidden = false;
  }, false);
  function closePanel() { $("panel").hidden = true; }
  $("p-close").addEventListener("click", closePanel, false);
  $("p-clear").addEventListener("click", function () {
    cdDate = ""; cdLabel = ""; store("dockCdDate", ""); store("dockCdLabel", "");
    closePanel(); applySettings(); tick();
  }, false);
  $("p-save").addEventListener("click", function () {
    var v = $("in-date").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { $("in-date").focus(); return; }
    cdDate = v;
    cdLabel = $("in-label").value.replace(/^\s+|\s+$/g, "").slice(0, 20);
    store("dockCdDate", cdDate); store("dockCdLabel", cdLabel);
    closePanel(); applySettings(); tick();
  }, false);
  $("dock").addEventListener("click", function () {
    if ($("menu").hidden) { showMenu(); } else { hideMenu(); }
  }, false);
  applySettings();
  tick();

  setTimeout(function () { var h = $("hint"); if (h && h.parentNode) { h.parentNode.removeChild(h); } }, 8000);
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, false);

  // Offline support: cache the page after the first load (iOS 11.3 and newer)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
